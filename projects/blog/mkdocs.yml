site_name: dap.gal/blog
site_url: https://dap.gal/blog/
#use_directory_urls: false
site_description: >
  Blog técnico sobre administración de sistemas, Linux, ciberseguridad,
  DevSecOps, virtualización, automatización e infraestructura.

# Configuración del Repositorio
repo_name: dap.gal/blog
repo_url: https://github.com/davidalvarezp/dap.gal/tree/main/projects/blog
edit_uri: edit/main/docs/



# IMPORTANTE: dentro de subproyecto
docs_dir: docs

# --------------------------------------------------
# THEME
# --------------------------------------------------

theme:
  name: material
  language: es

  logo: https://dap.gal/assets/img/logo.webp
  favicon: https://dap.gal/assets/img/favicon.ico

  font:
    text: JetBrains Mono

  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: green
      toggle:
        icon: material/weather-night
        name: Modo oscuro

    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Modo claro

  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.top

    - search.highlight
    - search.suggest

    - content.code.copy
    - content.code.annotate

    - content.action.edit

    - toc.integrate


# --------------------------------------------------
# CSS
# --------------------------------------------------

extra_css:
  - assets/css/extra.css


# --------------------------------------------------
# MARKDOWN
# --------------------------------------------------

markdown_extensions:

  - admonition
  - attr_list
  - md_in_html

  - toc:
      permalink: true
      toc_depth: 3

  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets

  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true

  - pymdownx.tabbed:
      alternate_style: true


# --------------------------------------------------
# PLUGINS
# --------------------------------------------------
plugins:
  - search
  - meta

  # BLOG
  - blog:
      blog_dir: .
      post_dir: posts

      # Excerpts
      post_excerpt: required
      post_excerpt_separator: <!-- more -->

      # Reading time
      post_readtime: true
      post_readtime_words_per_minute: 200

      # Index
      pagination: true
      pagination_per_page: 6

      # Organization
      categories: true
      categories_pagination_per_page: 10

      # Keep archive available for SEO/discovery
      archive: true
      archive_name: Archivo

      # Authors
      authors: true
      authors_profiles: true

      # Don't show huge metadata blocks in excerpts
      post_excerpt_max_categories: 2
      post_excerpt_max_authors: 1


  # ------------------------------------------------
  # RSS
  # ------------------------------------------------

  - rss:
      match_path: posts/.*
      date_from_meta:
        as_creation: date

      categories:
        - categories
        - tags

      pretty_print: true


  # ------------------------------------------------
  # SOCIAL CARDS
  # ------------------------------------------------

  - social


# --------------------------------------------------
# EXTRA
# --------------------------------------------------
extra:
  generator: false

  social:
    - icon: fontawesome/brands/github
      link: https://github.com/davidalvarezp/
      name: GitHub


# --------------------------------------------------
# NAV
# --------------------------------------------------

nav:
  - dap.gal: https://dap.gal/
  - Blog: index.md